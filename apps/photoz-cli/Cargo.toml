[package]
name = "photoz-cli"
description = "Headless PhotoZ: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional photoz-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photoz-codecs/heif"]

[lints]
workspace = true

[lib]
name = "photoz_cli"
path = "src/lib.rs"

[[bin]]
name = "photoz-cli"
path = "src/main.rs"

[dependencies]
photoz-automation = { path = "../../crates/automation" }
photoz-engine = { workspace = true }
photoz-io = { workspace = true }
photoz-format = { path = "../../crates/format" }
photoz-codecs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Synthetic camera raws (#7789).
photoz-raw = { workspace = true, features = ["testgen"] }
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in
# the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for photoz-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

