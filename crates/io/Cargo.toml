[package]
name = "photoz-io"
description = "Import/export between photoz documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to photoz-codecs; see its `heif` feature).
heif = ["photoz-codecs/heif", "photoz-formats/heif"]
# Test support for synthetic memory injection, estimate charges and verification across crates.
testgen = []
# Editable PDF import (experimental): painted paths and embedded-font text become editable
# layers; unsupported constructs keep the raster page.
pdf-editable = ["dep:kurbo"]

[dependencies]
photoz-geom = { workspace = true }
photoz-color = { workspace = true }
craft-cms = { workspace = true }
photoz-raster = { workspace = true }
photoz-doc = { workspace = true }
photoz-compose = { workspace = true }
photoz-algo = { workspace = true }
craft-psd = { workspace = true }
photoz-codecs = { workspace = true }
photoz-formats = { workspace = true }
photoz-raw = { workspace = true }
craft-affinity = { workspace = true }
photoz-text = { workspace = true }
photoz-paint = { workspace = true }
photoz-vector = { workspace = true }
photoz-format = { path = "../format" }
craft-pdf = { workspace = true }
craft-docpath = { workspace = true }
craft-ora = { workspace = true }
craft-kra = { workspace = true }
craft-xcf = { workspace = true }
craft-pdn = { workspace = true }
craft-svg = { workspace = true }
craft-tiff = { workspace = true }
craft-crs = { workspace = true }
craft-xml = { workspace = true }
thiserror = { workspace = true }
ttf-parser = "0.25.1"
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The SVG fallback font search keeps each font file's character map (already in the tree through usvg).
ttf-parser = { version = "0.25", default-features = false }
# PDF import (pdf_import.rs): craft-pdf rasterizes pages in pure Rust; no shared library ships.
craft-pdf = { workspace = true }
# Editable PDF import (pdf_editable.rs): craft-pdf's Device trait uses kurbo paths and transforms.
# This is the same kurbo 0.13 that craft-pdf already links; naming it adds no crate to the graph.
kurbo = { version = "0.13", optional = true }

[dev-dependencies]
lopdf = { version = "0.38", default-features = false }
# PDF XMP serialization assertions parse output XML in tests.
roxmltree = "0.21"
miniz_oxide = "0.9"
crc32fast = "1.5"
craft-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
craft-psd = { workspace = true, features = ["testgen"] }
photoz-raw = { workspace = true, features = ["testgen"] }
photoz-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless JPEG XL encoder for the JPEG XL DNG preview test (tests only), as in photoz-raw.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = { workspace = true }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
