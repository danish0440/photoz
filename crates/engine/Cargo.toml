[package]
name = "photoz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
photoz-geom = { workspace = true }
photoz-color = { workspace = true }
photoz-cms = { workspace = true }
photoz-raster = { workspace = true }
photoz-doc = { workspace = true }
photoz-ops = { workspace = true }
photoz-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
photoz-paint = { workspace = true }
photoz-algo = { workspace = true }
photoz-text = { workspace = true }
photoz-vector = { workspace = true }
photoz-io = { workspace = true }
photoz-psd = { workspace = true }
photoz-format = { workspace = true }
photoz-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
photoz-codecs = { workspace = true }
flate2 = { workspace = true }
craft-print = { workspace = true }

# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through photoz-ui-egui and usvg.
roxmltree = "0.20"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
photoz-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
photoz-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
