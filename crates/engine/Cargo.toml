[package]
name = "photoz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Not `src/lib.rs`: the engine's sources moved to crates/engine-core/src, and with the old path gone
# git carries open branches' edits of `src/lib.rs` to `crates/engine-core/src/lib.rs` (photoz#15710).
[lib]
path = "src/facade.rs"

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = ["photoz-engine-vector/corpus"]

# The engine's code and dependencies live in the engine crates; this crate re-exports them.
[dependencies]
photoz-engine-core = { workspace = true }
photoz-engine-paint = { workspace = true }
photoz-engine-vector = { workspace = true }

# What tests/ and examples/ use.
[dev-dependencies]
craft-affinity = { workspace = true, features = ["synth"] }
craft-cms = { workspace = true }
craft-develop-model = { workspace = true }
craft-psd = { workspace = true }
flate2 = { workspace = true }
photoz-algo = { workspace = true }
photoz-codecs = { workspace = true }
photoz-color = { workspace = true }
photoz-compose = { workspace = true }
photoz-doc = { workspace = true }
photoz-format = { workspace = true }
photoz-geom = { workspace = true }
photoz-io = { workspace = true, features = ["testgen"] }
photoz-paint = { workspace = true }
photoz-raster = { workspace = true }
photoz-testkit = { workspace = true }
photoz-text = { workspace = true }
photoz-vector = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
exr = { version = "1.73", default-features = false }
tempfile = "3"
