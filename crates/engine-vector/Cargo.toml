[package]
name = "photoz-engine-vector"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The vector-area commands of the engine (photoz#15710): align, layer comps, layer CSS and XMP,
# notes, path editing, rasterize style, smart-object SVG, traps and the type commands for areas,
# carets, masks and styles. Built on photoz-engine-core.
[dependencies]
photoz-engine-core = { workspace = true }
craft-cms = { workspace = true }
craft-xml = { workspace = true }
photoz-algo = { workspace = true }
photoz-codecs = { workspace = true }
photoz-color = { workspace = true }
photoz-compose = { workspace = true }
photoz-doc = { workspace = true }
photoz-format = { workspace = true }
photoz-geom = { workspace = true }
photoz-io = { workspace = true }
photoz-paint = { workspace = true }
photoz-raster = { workspace = true }
photoz-text = { workspace = true }
photoz-vector = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
flate2 = { workspace = true }

# Core's allocation failpoints, which the notes import and Type Mask tests arm.
[dev-dependencies]
photoz-engine-core = { workspace = true, features = ["failpoints"] }
photoz-io = { workspace = true, features = ["testgen"] }
photoz-testkit = { workspace = true }

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
